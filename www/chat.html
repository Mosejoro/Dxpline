<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dxpline — Chat</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Syne:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&family=Inter:wght@400;500;600&family=Atkinson+Hyperlegible:wght@400;700&family=Poppins:wght@400;500;600&family=Nunito:wght@400;600;700&family=Merriweather:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=Comic+Neue:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: var(--bg2);
        display: flex;
        flex-direction: column;
      }
      .chat-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--bdr2);
        background: var(--bg);
        flex-shrink: 0;
      }
      .chat-back {
        font-family: var(--mono);
        font-size: 18px;
        color: var(--tx3);
        cursor: pointer;
        line-height: 1;
      }
      .chat-back:hover {
        color: var(--tx);
      }
      .chat-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        object-fit: cover;
        border: 1px solid var(--bdr2);
        flex-shrink: 0;
        cursor: pointer;
      }
      .chat-name {
        font-family: var(--body);
        font-size: 14px;
        font-weight: 600;
        color: var(--tx);
      }
      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .msg {
        max-width: 75%;
        padding: 8px 12px;
        border-radius: 14px;
        font-family: var(--body);
        font-size: 13px;
        line-height: 1.4;
        overflow-wrap: break-word;
      }
      .msg-mine {
        align-self: flex-end;
        background: var(--tx);
        color: var(--bg);
        border-bottom-right-radius: 4px;
      }
      .msg-theirs {
        align-self: flex-start;
        background: var(--bg3);
        color: var(--tx);
        border: 1px solid var(--bdr2);
        border-bottom-left-radius: 4px;
      }
      .msg-time {
        font-family: var(--mono);
        font-size: 9px;
        opacity: 0.65;
        margin-top: 4px;
        display: block;
      }
      .chat-empty {
        text-align: center;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--tx3);
        margin: auto;
      }
      .chat-input-row {
        display: flex;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid var(--bdr2);
        background: var(--bg);
        flex-shrink: 0;
      }
      .chat-input {
        flex: 1;
        box-sizing: border-box;
        padding: 10px 14px;
        border-radius: 20px;
        border: 1px solid var(--bdr2);
        background: var(--bg3);
        color: var(--tx);
        font-family: var(--body);
        font-size: 14px;
      }
      .chat-send {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: none;
        background: var(--tx);
        color: var(--bg);
        font-size: 16px;
        cursor: pointer;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div class="chat-head">
      <span class="chat-back" onclick="location.href = 'users.html'">←</span>
      <img
        src="img/default.png"
        class="chat-avatar"
        id="chatAvatar"
        onclick="showImageLightbox(this.src)"
      />
      <div class="chat-name" id="chatName">—</div>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="chat-input-row">
      <input
        type="text"
        id="chatInput"
        class="chat-input"
        placeholder="Message…"
      />
      <button class="chat-send" id="chatSendBtn">➤</button>
    </div>

    <div class="toast" id="toast"></div>

    <script src="cordova.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/profile-shared.js"></script>
    <script src="js/firestore-helpers.js"></script>
    <script src="js/font.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/image-lightbox.js"></script>
    <script src="js/chat.js"></script>
  </body>
</html>
