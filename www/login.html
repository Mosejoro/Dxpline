<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dxpline — Sign In</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Syne:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      body.auth-body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: var(--bg);
      }
      .auth-card {
        width: 360px;
        max-width: 90vw;
        background: var(--bg2);
        border: 1px solid var(--bdr2);
        border-radius: 12px;
        padding: 28px;
      }
      .auth-title {
        font-family: "Syne", sans-serif;
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 4px;
        color: var(--tx);
      }
      .auth-sub {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        color: var(--tx3);
        margin-bottom: 20px;
      }
      .auth-tabs {
        display: flex;
        margin-bottom: 18px;
        border: 1px solid var(--bdr2);
        border-radius: 8px;
        overflow: hidden;
      }
      .auth-tabs button {
        flex: 1;
        padding: 8px 0;
        background: transparent;
        border: none;
        color: var(--tx3);
        font-family: "Space Grotesk", sans-serif;
        font-size: 13px;
        cursor: pointer;
      }
      .auth-tabs button.on {
        background: var(--bg3);
        color: var(--tx);
      }
      .auth-fld {
        margin-bottom: 12px;
      }
      .auth-fld label {
        display: block;
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--tx3);
        margin-bottom: 4px;
      }
      .auth-fld input {
        width: 100%;
        box-sizing: border-box;
        padding: 9px 10px;
        background: var(--bg3);
        border: 1px solid var(--bdr2);
        border-radius: 6px;
        color: var(--tx);
        font-family: "Space Grotesk", sans-serif;
        font-size: 13px;
      }
      .auth-fld input:focus {
        outline: none;
        border-color: var(--tx3);
      }
      .auth-submit {
        width: 100%;
        padding: 10px 0;
        margin-top: 4px;
        background: var(--tx);
        color: var(--bg);
        border: none;
        border-radius: 6px;
        font-family: "Space Grotesk", sans-serif;
        font-weight: 500;
        font-size: 13px;
        cursor: pointer;
      }
      .auth-divider {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 18px 0;
        color: var(--tx3);
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        text-transform: uppercase;
      }
      .auth-divider::before,
      .auth-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--bdr2);
      }
      .auth-google {
        width: 100%;
        padding: 10px 0;
        background: transparent;
        border: 1px solid var(--bdr2);
        border-radius: 6px;
        color: var(--tx);
        font-family: "Space Grotesk", sans-serif;
        font-size: 13px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .auth-error {
        display: none;
        margin-top: 12px;
        padding: 8px 10px;
        border-radius: 6px;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #ef4444;
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
      }
      .auth-pane {
        display: none;
      }
      .auth-pane.on {
        display: block;
      }
    </style>
  </head>
  <body class="auth-body">
    <div class="auth-card">
      <div class="auth-title">Dx<em>pline</em></div>
      <div class="auth-sub">Sign in to sync your discipline record</div>

      <div class="auth-tabs">
        <button id="tabSignIn" class="on" onclick="showPane('signin')">
          Sign In
        </button>
        <button id="tabSignUp" onclick="showPane('signup')">Sign Up</button>
      </div>

      <div id="paneSignIn" class="auth-pane on">
        <div class="auth-fld">
          <label>Email</label>
          <input id="siEmail" type="email" placeholder="you@example.com" />
        </div>
        <div class="auth-fld">
          <label>Password</label>
          <input id="siPass" type="password" placeholder="••••••••" />
        </div>
        <button class="auth-submit" onclick="signInEmail()">Sign In</button>
      </div>

      <div id="paneSignUp" class="auth-pane">
        <div class="auth-fld">
          <label>Name</label>
          <input id="suName" placeholder="Your name" />
        </div>
        <div class="auth-fld">
          <label>Email</label>
          <input id="suEmail" type="email" placeholder="you@example.com" />
        </div>
        <div class="auth-fld">
          <label>Password</label>
          <input
            id="suPass"
            type="password"
            placeholder="At least 6 characters"
          />
        </div>
        <button class="auth-submit" onclick="signUpEmail()">
          Create Account
        </button>
      </div>

      <div class="auth-divider">or</div>
      <button class="auth-google" onclick="signInGoogle()">
        <svg width="16" height="16" viewBox="0 0 48 48">
          <path
            fill="#FFC107"
            d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"
          />
          <path
            fill="#FF3D00"
            d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"
          />
          <path
            fill="#4CAF50"
            d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 35.1 26.9 36 24 36c-5.2 0-9.6-3.3-11.2-7.9l-6.5 5C9.6 39.6 16.3 44 24 44z"
          />
          <path
            fill="#1976D2"
            d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.3-4.1 5.7l6.6 5.6C41.4 36.4 44 30.7 44 24c0-1.3-.1-2.7-.4-3.5z"
          />
        </svg>
        Continue with Google
      </button>

      <div id="authError" class="auth-error"></div>
    </div>

    <!-- Cordova bootstrap — must load first for deviceready/native plugins to work -->
    <script src="cordova.js"></script>
    <!-- Firebase JS SDK (compat build — no bundler needed) -->
    <script
      src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"
      onerror="
        alert(
          'DEBUG: firebase-app-compat.js FAILED TO LOAD (network/CSP block)',
        )
      "
    ></script>
    <script
      src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"
      onerror="
        alert(
          'DEBUG: firebase-auth-compat.js FAILED TO LOAD (network/CSP block)',
        )
      "
    ></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/auth.js"></script>
    <script>
      function showPane(which) {
        document
          .querySelectorAll(".auth-pane")
          .forEach((p) => p.classList.remove("on"));
        document
          .querySelectorAll(".auth-tabs button")
          .forEach((b) => b.classList.remove("on"));
        document
          .getElementById(which === "signin" ? "paneSignIn" : "paneSignUp")
          .classList.add("on");
        document
          .getElementById(which === "signin" ? "tabSignIn" : "tabSignUp")
          .classList.add("on");
      }
    </script>
  </body>
</html>
